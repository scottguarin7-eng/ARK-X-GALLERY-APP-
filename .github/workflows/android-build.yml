name: Build ARK-X Gallery APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install Android 37
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37"

      - name: Locate Android project folder
        id: project
        shell: bash
        run: |
          if [[ -f "settings.gradle.kts" && -d "app" ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [[ -f "ARK-X-Gallery/settings.gradle.kts" && -d "ARK-X-Gallery/app" ]]; then
            echo "project_dir=ARK-X-Gallery" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts and app/ in the repository root or ARK-X-Gallery/ folder."
            exit 1
          fi

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-x-gallery-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
